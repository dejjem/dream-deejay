name: Build Debug APK
on:
  push:
    branches: [master, main, vega/build-fix, agent/vega/5a1adcff]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - uses: android-actions/setup-android@v4

      - name: Create local.properties
        run: |
          echo "flutter.sdk=/opt/flutter" > local.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run flutter doctor
        run: flutter doctor -v

      - name: Run flutter analyze
        run: flutter analyze || true

      - name: Build debug APK
        run: |
          flutter build apk --debug --no-pub -v 2>&1 | tee build.log
          echo "---APK BUILD ARTIFACTS---"
          find build/app/outputs -type f 2>/dev/null || echo "No build/outputs found"
          echo "---APK FILE CHECK---"
          if [ -f build/app/outputs/flutter-apk/app-debug.apk ]; then
            ls -lh build/app/outputs/flutter-apk/app-debug.apk
            echo "APK EXISTS"
          else
            echo "WARNING: APK NOT FOUND"
            echo "build/app/outputs contents:"
            ls -laR build/app/outputs/ 2>/dev/null || echo "outputs dir does not exist"
            echo "build/ directory:"
            ls -laR build/ 2>/dev/null | head -50 || echo "build dir does not exist"
          fi

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-log
          path: build.log

      - uses: actions/upload-artifact@v5
        if: success()
        with:
          name: debug-apk
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build.log
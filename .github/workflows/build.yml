name: Build Debug APK
on:
  push:
    branches: [master, main, vega/build-fix]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - uses: android-actions/setup-android@v3

      - name: Regenerate Android project (fix unsupported Gradle project)
        run: |
          # Backup ALL critical files including root build.gradle
          cp android/app/build.gradle /tmp/app_build.gradle.bak
          cp android/app/proguard-rules.pro /tmp/proguard-rules.pro.bak
          cp android/gradle.properties /tmp/gradle.properties.bak
          cp android/build.gradle /tmp/build.gradle.bak
          cp android/settings.gradle /tmp/settings.gradle.bak
          # Remove old android/ and regenerate
          rm -rf android/
          flutter create -t app . --platforms android --org com.dreamdeejay
          # Restore all custom gradle files
          cp /tmp/app_build.gradle.bak android/app/build.gradle
          cp /tmp/proguard-rules.pro.bak android/app/proguard-rules.pro
          cp /tmp/gradle.properties.bak android/gradle.properties
          cp /tmp/build.gradle.bak android/build.gradle
          cp /tmp/settings.gradle.bak android/settings.gradle

      - name: Create local.properties
        run: |
          mkdir -p android
          echo "flutter.sdk=/opt/flutter" >> local.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

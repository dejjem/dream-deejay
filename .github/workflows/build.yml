name: Build Debug APK
on:
  push:
    branches: [master, main, vega/build-fix, agent/vega/5a1adcff]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0'
          cache: true

      - uses: android-actions/setup-android@v4

      - name: Create local.properties
        run: |
          mkdir -p android
          FLUTTER_ROOT=$(dirname $(dirname $(which flutter)))
          echo "Detected FLUTTER_ROOT: $FLUTTER_ROOT"
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties

      - name: Debug Flutter setup
        run: |
          echo "=== FLUTTER SDK DEBUG ==="
          cat android/local.properties
          which flutter || echo "flutter not in PATH"
          flutter --version || echo "flutter --version failed"
          echo "FLUTTER_ROOT=${FLUTTER_ROOT:-unknown}"
          ls -la /opt/flutter/bin/flutter 2>/dev/null || echo "/opt/flutter/bin/flutter not found"
          ls -la /opt/hostedtoolcache/flutter/ 2>/dev/null || echo "/opt/hostedtoolcache/flutter/ not found"
          echo "=== ANDROID SDK DEBUG ==="
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          ls -la $ANDROID_HOME 2>/dev/null || echo "Android SDK not at ANDROID_HOME"
          ls -la /opt/android-sdk 2>/dev/null || echo "/opt/android-sdk not found"
          echo "=== GRADLE DEBUG ==="
          ls -la android/build.gradle android/settings.gradle 2>/dev/null || echo "Gradle files missing"
          cat android/settings.gradle | head -10
          echo "=== PUBSPEC DEBUG ==="
          ls -la pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run flutter doctor
        run: flutter doctor -v

      - name: Run flutter analyze
        run: flutter analyze || true

      - name: Build debug APK
        run: |
          echo "PWD=$(pwd)"
          echo "---LISTING BEFORE BUILD---"
          ls -la build/app/outputs/flutter-apk/ 2>/dev/null || echo "build/app/outputs/flutter-apk/ does not exist yet"
          echo "---RUNNING FLUTTER BUILD---"
          set -o pipefail
          flutter build apk --debug 2>&1 | tee build.log; EXIT_CODE=$?
          echo "flutter build exit_code=$EXIT_CODE"
          echo "---LISTING AFTER BUILD---"
          ls -la build/app/outputs/flutter-apk/ 2>/dev/null || echo "build/app/outputs/flutter-apk/ does not exist"
          ls -la build/ 2>/dev/null | head -20 || echo "build/ dir empty/missing"
          echo "---APK BUILD ARTIFACTS---"
          find build/app/outputs -type f 2>/dev/null || echo "No build/outputs found"
          if [ -f build/app/outputs/flutter-apk/app-debug.apk ]; then echo "APK_EXISTS=true"; else echo "APK_EXISTS=false"; fi

      - name: Verify APK exists
        run: |
          echo "Checking for APK..."
          if [ -f build/app/outputs/flutter-apk/app-debug.apk ]; then
            APK_SIZE=$(stat -c%s build/app/outputs/flutter-apk/app-debug.apk 2>/dev/null || echo 0)
            echo "APK found, size: $APK_SIZE bytes"
            if [ "$APK_SIZE" -lt 1000 ]; then
              echo "ERROR: APK is too small (${APK_SIZE} bytes) - build may have failed silently"
              cat build.log
              exit 1
            fi
            echo "APK size OK"
          else
            echo "ERROR: APK not found at build/app/outputs/flutter-apk/app-debug.apk"
            echo "Contents of build/app/outputs:"
            ls -laR build/app/outputs/ 2>/dev/null || echo "Directory does not exist"
            echo "Contents of build/:"
            ls -laR build/ 2>/dev/null | head -100
            cat build.log
            exit 1
          fi

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-log
          path: build.log

      - uses: actions/upload-artifact@v5
        if: success()
        with:
          name: debug-apk
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build.log
name: Build Release APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  flutter_version: '3.22.0'
  java_version: '17'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.java_version }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter_version }}
          channel: 'stable'

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            build/
            android/.gradle/
            android/app/build/
          key: ${{ runner.os }}-flutter-${{ env.flutter_version }}-deps-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-${{ env.flutter_version }}-

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze --no-fatal-infos || true

      - name: Build debug APK (validate shell project)
        run: flutter build apk --debug

      - name: Generate code (json_serializable, retrofit)
        run: flutter pub run build_runner build --delete-conflicting-outputs || true

      - name: Build release APK
        run: |
          flutter build apk --release \
            --target-platform android-arm64,android-arm \
            2>&1 | tail -20

      - name: Verify APK exists
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          if [ -f "$APK_PATH" ]; then
            echo "APK size: $(du -h $APK_PATH | cut -f1)"
            echo "APK SHA256: $(sha256sum $APK_PATH | cut -d' ' -f1)"
          else
            echo "ERROR: Release APK not found at $APK_PATH"
            ls -la build/app/outputs/flutter-apk/ 2>/dev/null || echo "Directory not found"
            exit 1
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: dream-deejay-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dream-deejay-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  # Build a signed release APK when secrets are available
  sign:
    needs: build
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.KEYSTORE_BASE64 != ''
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: dream-deejay-release-apk
          path: ./apk/

      - name: Decode keystore
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > ./keystore.jks
          echo "Keystore decoded: $(ls -la keystore.jks)"

      - name: Sign APK
        run: |
          ${ANDROID_HOME}/build-tools/35.0.0/apksigner sign \
            --ks ./keystore.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "env:KEYSTORE_PASSWORD" \
            --key-pass "env:KEY_PASSWORD" \
            --out ./signed-app.apk \
            ./apk/app-release.apk

      - name: Align APK
        run: |
          ${ANDROID_HOME}/build-tools/35.0.0/zipalign \
            -f -v 4 \
            ./signed-app.apk \
            ./aligned-app.apk

      - name: Verify signature
        run: |
          ${ANDROID_HOME}/build-tools/35.0.0/apksigner verify -v ./aligned-app.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: dream-deejay-signed-apk
          path: ./aligned-app.apk
          retention-days: 30
        env:
          KEYSTORE_BASE64: ${{ vars.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ vars.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
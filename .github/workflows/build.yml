name: Build Debug APK
on:
  push:
    branches: [master, main, vega/build-fix, agent/vega/5a1adcff]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - uses: android-actions/setup-android@v4

      - name: Regenerate Android project (fix unsupported Gradle project)
        run: |
          # Backup critical custom files
          cp android/app/build.gradle /tmp/app_build.gradle.bak
          cp android/app/proguard-rules.pro /tmp/proguard-rules.pro.bak
          cp android/gradle.properties /tmp/gradle.properties.bak
          # Remove old android/ and regenerate
          rm -rf android/
          flutter create -t app . --platforms android --org com.dreamdeejay
          # Restore custom gradle files
          cp /tmp/app_build.gradle.bak android/app/build.gradle
          cp /tmp/proguard-rules.pro.bak android/app/proguard-rules.pro
          cp /tmp/gradle.properties.bak android/gradle.properties

      - name: Create local.properties
        run: |
          mkdir -p android
          echo "flutter.sdk=/opt/flutter" >> local.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run flutter doctor
        run: flutter doctor -v

      - name: Run flutter analyze
        run: flutter analyze || true

      - name: Build debug APK
        run: |
          flutter build apk --debug 2>&1 | tee build.log
          echo "---APK BUILD ARTIFACTS---"
          find build/app/outputs -type f 2>/dev/null || echo "No build/outputs found"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-log
          path: build.log

      - uses: actions/upload-artifact@v5
        if: success()
        with:
          name: debug-apk
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build.log
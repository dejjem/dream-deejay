name: dream_deejay
description: Dream DeeJay — native Android music app with AI DJ
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Audio playback
  android_media_session_service: ^1.0.0
  just_audio: ^0.9.39
  audio_service: ^0.18.15
  audio_session: ^0.1.21

  # Networking
  dio: ^5.4.3+1
  retrofit: ^4.1.0
  retrofit_generator: ^8.1.0

  # JSON serialization
  json_annotation: ^4.9.0
  json_serializable: ^6.8.0

  # Dependency injection
  get_it: ^7.7.0

  # Image loading
  cached_network_image: ^3.3.1

  # Local storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.3
  sqflite: ^2.3.3
  path: ^1.9.0
  http: ^1.2.1

  # Location
  geolocator: ^12.0.0
  permission_handler: ^11.3.1

  # TTS
  flutter_tts: ^4.0.2

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  lottie: ^3.1.2

  # State management
  provider: ^6.1.2
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1

  # Utils
  equatable: ^2.0.5
  uuid: ^4.4.2
  intl: ^0.19.0
  rxdart: ^0.28.0
  collection: ^1.18.0

  # HTTP interceptors
  pretty_dio_logger: ^1.3.1

  # OAuth webview
  webview_flutter: ^4.8.0
  flutter_appauth: ^2.2.1
  crypto: ^3.0.3

  # Notifications
  flutter_local_notifications: ^17.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  retrofit_generator: ^8.1.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/images/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700